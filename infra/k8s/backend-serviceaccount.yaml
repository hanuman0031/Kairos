# =============================================================================
# Kairos Backend ServiceAccount — Workload Identity Federation
# =============================================================================
# This Kubernetes ServiceAccount is bound to a GCP Service Account via
# Workload Identity, granting the backend pods access to Vertex AI
# without ever storing a service-account key.
#
# Prerequisites (one-time setup):
#   1. Create the GCP SA:
#      gcloud iam service-accounts create kairos-vertex-ai \
#        --display-name="Kairos Vertex AI SA"
#
#   2. Grant Vertex AI access:
#      gcloud projects add-iam-policy-binding <PROJECT_ID> \
#        --member="serviceAccount:kairos-vertex-ai@<PROJECT_ID>.iam.gserviceaccount.com" \
#        --role="roles/aiplatform.user"
#
#   3. Bind the K8s SA to the GCP SA:
#      gcloud iam service-accounts add-iam-policy-binding \
#        kairos-vertex-ai@<PROJECT_ID>.iam.gserviceaccount.com \
#        --role roles/iam.workloadIdentityUser \
#        --member "serviceAccount:<PROJECT_ID>.svc.id.goog[kairos/kairos-backend-sa]"
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairos-backend-sa
  namespace: kairos
  labels:
    app.kubernetes.io/name: kairos-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kairos-platform
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # Workload Identity binding — replace <PROJECT_ID> with your GCP project.
    iam.gke.io/gcp-service-account: "kairos-vertex-ai@<PROJECT_ID>.iam.gserviceaccount.com"
    